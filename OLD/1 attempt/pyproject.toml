[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turbinis-curs"
version = "0.1.0"
description = "Engineering study and optimizer for a three-stage TPE331-class turbine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas",
]

[project.optional-dependencies]
test = ["pytest>=8"]
plot = ["matplotlib"]
notebook = [
    "ipykernel",
    "jinja2",
    "jupyterlab",
    "matplotlib",
    "nbconvert",
    "openpyxl",
]
digitize = ["Pillow"]
parquet = ["pyarrow>=14"]
jax = ["jax>=0.12"]

# Install extracted packages, not the legacy hyphenated calculation directories.
[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = ["turbine*"]

[tool.pytest.ini_options]
addopts = "-ra"
markers = [
    "physics: deterministic physical invariant checks",
    "regression: immutable reference comparisons",
    "optimization: optimizer smoke checks",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turbinis-course-blading"
version = "0.1.0"
description = "Vinogradov blade design for the two-stage Turbinis course calculation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas", "matplotlib", "ipython"]

[project.optional-dependencies]
test = ["pytest>=8"]
cad = ["ezdxf>=1.4", "cadquery>=2.6"]
notebook = ["ipykernel", "jupyterlab", "nbconvert", "nbformat"]

[tool.setuptools.packages.find]
include = ["vinogradov*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
